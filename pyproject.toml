[project]
name = "underwriter"
version = "0.1.0"
description = "Mortgage underwriting multi-agent system: LangGraph, MCP, A2A, Claude, DeepEval"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned to the versions used in the course notebook.
    "langgraph==1.1.9",
    "mcp[cli]==1.30.0",
    "a2a-sdk==1.1.2",
    "deepeval==4.2.2",
    # Not in the notebook: resolved alongside the pins above, then pinned.
    "anthropic==2.8.0",
    "langgraph-checkpoint-sqlite==3.1.3",
    "aiosqlite==0.22.1",
    "streamlit==1.67.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/underwriter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:deepeval"
filterwarnings = ["ignore:label\\(\\) is deprecated:DeprecationWarning"]
pythonpath = ["."]
